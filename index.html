<!DOCTYPE html>
<html lang="id" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OverlayKu — Auto-Scan Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F7F9;
      --surface: #FFFFFF;
      --surface-2: #F0F2F5;
      --text: #111827;
      --muted: #6B7280;
      --border: #E5E7EB;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-soft: #EFF6FF;
      --shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
    }

    [data-mode="dark"] {
      --bg: #0B0F17;
      --surface: #131A26;
      --surface-2: #1C2536;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --border: #243044;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 32px 20px 80px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container { max-width: 1120px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 24px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--accent);
      display: inline-block;
    }

    .brand p { color: var(--muted); font-size: 14px; margin-top: 2px; }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .domain-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .mode-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .mode-btn:hover { background: var(--surface-2); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .filter-pills { display: flex; flex-wrap: wrap; gap: 8px; }

    .pill {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .pill:hover { color: var(--text); border-color: var(--muted); }
    .pill.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .search-box { min-width: 240px; flex: 0 1 300px; }
    .search-box input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }

    .folder-section { margin-bottom: 40px; }

    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .folder-header h2 {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .folder-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface-2);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }

    .card h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      text-transform: capitalize;
    }

    .file-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
    }

    .actions { display: flex; gap: 8px; }

    .btn {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      font-family: inherit;
      text-decoration: none;
      text-align: center;
    }

    .btn-primary { flex: 1; background: var(--accent); color: #FFFFFF; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover { border-color: var(--muted); }

    .status-box {
      text-align: center;
      padding: 60px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .status-box strong { color: var(--text); }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text);
      color: var(--bg);
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.2s ease;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1><span class="brand-dot"></span> OverlayKu</h1>
        <p>Auto-detect semua file overlay HTML dari repository.</p>
      </div>
      <div class="header-right">
        <div class="domain-pill" id="live-domain">overlayku.vercel.app</div>
        <button class="mode-btn" id="mode-toggle" onclick="toggleMode()">🌙 Dark</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="filter-pills" id="folder-filters"></div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Cari nama file atau folder..." oninput="render()" />
      </div>
    </div>

    <main id="app">
      <div class="status-box">Memindai file overlay dari GitHub...</div>
    </main>
  </div>

  <div id="toast">URL disalin!</div>

  <script>
    // =========================================================================
    // 1. KONFIGURASI GITHUB (WAJIB DIISI)
    // =========================================================================
    const GITHUB_USER   = "USERNAME_GITHUB_KAMU"; // Ganti dengan username GitHub kamu
    const GITHUB_REPO   = "overlayku";            // Ganti dengan nama repo kamu
    const GITHUB_BRANCH = "main";                 // Biasanya "main" atau "master"

    // =========================================================================
    // 2. LOGIKA AUTO-SCAN (Tidak perlu diubah)
    // =========================================================================
    const origin = window.location.origin === "null" ? "https://overlayku.vercel.app" : window.location.origin;
    document.getElementById("live-domain").textContent = origin.replace(/^https?:\/\//, "");

    let groupedFiles = {};
    let activeFolder = "all";

    // Dark / Light Mode
    function toggleMode() {
      const html = document.documentElement;
      const next = html.getAttribute("data-mode") === "dark" ? "light" : "dark";
      html.setAttribute("data-mode", next);
      localStorage.setItem("overlayku-mode", next);
      document.getElementById("mode-toggle").textContent = next === "dark" ? "☀️ Light" : "🌙 Dark";
    }
    if (localStorage.getItem("overlayku-mode") === "dark") {
      document.documentElement.setAttribute("data-mode", "dark");
      document.getElementById("mode-toggle").textContent = "☀️ Light";
    }

    // Format nama file jadi judul rapi (misal: "running-text.html" -> "running text")
    function formatTitle(filename) {
      return filename
        .replace(/\.html?$/i, "")
        .replace(/[-_]+/g, " ");
    }

    // Toast & Copy URL
    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function copyUrl(relativePath) {
      const fullUrl = `${origin}/${encodeURI(relativePath)}`;
      navigator.clipboard.writeText(fullUrl).then(() => {
        showToast(`Disalin: ${fullUrl}`);
      }).catch(() => {
        prompt("Salin URL ini:", fullUrl);
      });
    }

    // Fetch daftar file otomatis dari GitHub
    async function scanRepo() {
      const app = document.getElementById("app");
      if (GITHUB_USER === "USERNAME_GITHUB_KAMU") {
        app.innerHTML = `<div class="status-box">Silakan isi <strong>GITHUB_USER</strong> dan <strong>GITHUB_REPO</strong> di dalam file <code>index.html</code> terlebih dahulu.</div>`;
        return;
      }

      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const htmlFiles = (data.tree || []).filter(item =>
          item.type === "blob" &&
          /\.html?$/i.test(item.path) &&
          item.path.toLowerCase() !== "index.html" // Kecualikan homepage sendiri
        );

        groupedFiles = {};
        htmlFiles.forEach(item => {
          const parts = item.path.split("/");
          const filename = parts.pop();
          const folder = parts.length > 0 ? parts.join("/") : "Root (Utama)";

          if (!groupedFiles[folder]) groupedFiles[folder] = [];
          groupedFiles[folder].push({
            title: formatTitle(filename),
            filename: filename,
            path: item.path
          });
        });

        renderFilters();
        render();
      } catch (err) {
        app.innerHTML = `
          <div class="status-box">
            Gagal memindai repository (<strong>${err.message}</strong>).<br/>
            Pastikan <strong>GITHUB_USER</strong>, <strong>GITHUB_REPO</strong>, <strong>GITHUB_BRANCH</strong> benar dan repo diset ke <strong>Public</strong>.
          </div>
        `;
      }
    }

    function renderFilters() {
      const folders = Object.keys(groupedFiles).sort();
      const wrap = document.getElementById("folder-filters");
      wrap.innerHTML = [
        `<button class="pill ${activeFolder === "all" ? "active" : ""}" onclick="setFilter('all')">Semua Folder (${folders.length})</button>`,
        ...folders.map(f =>
          `<button class="pill ${activeFolder === f ? "active" : ""}" onclick="setFilter('${f}')">${f}</button>`
        )
      ].join("");
    }

    function setFilter(folder) {
      activeFolder = folder;
      renderFilters();
      render();
    }

    function render() {
      const app = document.getElementById("app");
      const keyword = document.getElementById("search-input").value.trim().toLowerCase();
      const folders = Object.keys(groupedFiles).sort();

      app.innerHTML = "";
      let totalShown = 0;

      folders.forEach(folder => {
        if (activeFolder !== "all" && activeFolder !== folder) return;

        const items = groupedFiles[folder].filter(item => {
          if (!keyword) return true;
          return (
            item.title.toLowerCase().includes(keyword) ||
            item.path.toLowerCase().includes(keyword) ||
            folder.toLowerCase().includes(keyword)
          );
        });

        if (items.length === 0) return;
        totalShown += items.length;

        const cardsHtml = items.map(item => `
          <div class="card">
            <div>
              <h3>${item.title}</h3>
              <div class="file-path">/${item.path}</div>
            </div>
            <div class="actions">
              <button class="btn btn-primary" onclick="copyUrl('${item.path}')">Copy URL</button>
              <a class="btn btn-secondary" href="${encodeURI(item.path)}" target="_blank">Preview ↗</a>
            </div>
          </div>
        `).join("");

        const section = document.createElement("section");
        section.className = "folder-section";
        section.innerHTML = `
          <div class="folder-header">
            <h2>📁 ${folder}</h2>
            <span class="folder-path">${items.length} file</span>
          </div>
          <div class="grid">${cardsHtml}</div>
        `;
        app.appendChild(section);
      });

      if (totalShown === 0) {
        app.innerHTML = `<div class="status-box">Tidak ada file overlay HTML yang ditemukan.</div>`;
      }
    }

    scanRepo();
  </script>
</body>
</html>
