<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Minimalist — Stream Closing (Meriah)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 45%, #FFFDF6 0%, #F5F1E3 50%, #DDEEE4 100%);
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .bg-grid {
      position: absolute;
      inset: -50px;
      background-image:
        linear-gradient(rgba(212, 175, 55, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 175, 55, 0.08) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridDrift 22s linear infinite;
    }

    @keyframes gridDrift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-48px, 48px); }
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.55;
      animation: pulseOrb 7s ease-in-out infinite alternate;
    }
    .orb-1 { width: 440px; height: 440px; background: #FDE68A; top: -90px; right: -70px; }
    .orb-2 { width: 400px; height: 400px; background: #A7F3D0; bottom: -90px; left: -70px; animation-delay: -3.5s; }

    @keyframes pulseOrb {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    .outer-frame {
      position: absolute;
      inset: 28px;
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      pointer-events: none;
      z-index: 2;
    }

    .hud-ring {
      position: absolute;
      width: min(84vw, 780px);
      height: min(84vw, 780px);
      pointer-events: none;
      z-index: 1;
      opacity: 0.45;
      animation: spinSlow 40s linear infinite;
    }

    @keyframes spinSlow { to { transform: rotate(360deg); } }

    /* Partikel confetti / bintang jatuh perlahan */
    #confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .bit {
      position: absolute;
      top: -30px;
      animation: fall linear infinite;
      opacity: 0;
    }

    .bit.ribbon {
      border-radius: 2px;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      12% { opacity: 0.95; }
      85% { opacity: 0.85; }
      100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
    }

    /* Kartu Utama */
    .card {
      position: relative;
      width: min(88vw, 780px);
      padding: clamp(36px, 5vw, 60px) clamp(26px, 4vw, 56px);
      background: rgba(250, 248, 242, 0.95);
      backdrop-filter: blur(8px);
      border: 2px solid #D4AF37;
      border-top: 7px solid #D4AF37;
      border-bottom: 5px solid #10B981;
      clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 28px, 100% 100%, 28px 100%, 0 calc(100% - 28px));
      box-shadow: 0 24px 60px rgba(146, 64, 14, 0.14);
      text-align: center;
      z-index: 5;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(254, 243, 199, 0.55), transparent);
      animation: sweep 5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sweep {
      0% { left: -60%; }
      55%, 100% { left: 130%; }
    }

    .jp-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: linear-gradient(135deg, #92400E 0%, #D4AF37 100%);
      color: #FFFDF8;
      font-size: clamp(11px, 1.4vw, 14px);
      font-weight: 700;
      letter-spacing: 2.2px;
      padding: 7px 24px;
      margin-bottom: 22px;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      border-bottom: 2.5px solid #065F46;
    }

    h1 {
      font-size: clamp(34px, 5.5vw, 60px);
      font-weight: 800;
      color: #14241E;
      letter-spacing: 2px;
      line-height: 1.12;
      margin-bottom: 12px;
    }

    h1 span {
      background: linear-gradient(135deg, #B45309 0%, #D4AF37 50%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(14px, 1.8vw, 18px);
      color: #4B6358;
      font-weight: 600;
      margin-bottom: 30px;
    }

    /* Social Media Pills */
    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .soc-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: 1.5px solid rgba(212, 175, 55, 0.7);
      padding: 8px 16px;
      font-size: clamp(12px, 1.4vw, 14px);
      font-weight: 700;
      color: #1C2B24;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      box-shadow: 0 6px 14px rgba(10, 35, 25, 0.06);
    }

    .soc-tag {
      background: #065F46;
      color: #FAF8F2;
      font-size: 10px;
      padding: 2px 8px;
      letter-spacing: 1px;
    }
    .soc-tag.gold { background: #D4AF37; color: #1C2B24; }

    .footer-note {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #065F46;
      text-transform: uppercase;
    }

    .footer-note span { color: #D4AF37; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="outer-frame"></div>

  <svg class="hud-ring" viewBox="0 0 200 200" fill="none">
    <circle cx="100" cy="100" r="92" stroke="#D4AF37" stroke-width="0.9" stroke-dasharray="14 6" />
    <circle cx="100" cy="100" r="78" stroke="#10B981" stroke-width="0.7" stroke-dasharray="5 7" />
    <polygon points="100,10 190,100 100,190 10,100" stroke="#10B981" stroke-width="0.5" opacity="0.6" />
  </svg>

  <div id="confetti"></div>

  <div class="card">
    <div class="jp-badge">
      ✦ ご視聴ありがとうございました • STREAM ENDED ✦
    </div>

    <h1>THANK YOU FOR <span>WATCHING!</span></h1>
    <p class="subtitle">Terima kasih buat semua yang sudah mampir, tap-tap, share, & support hari ini!</p>

    <div class="socials">
      <div class="soc-item">
        <span class="soc-tag">TIKTOK</span>
        <span>@.forminge</span>
      </div>
      <div class="soc-item">
        <span class="soc-tag gold">YOUTUBE</span>
        <span>@Forminge</span>
      </div>
    </div>

    <div class="footer-note">
      <span>✦</span> SEE YOU NEXT STREAM • またね！ <span>✦</span>
    </div>
  </div>

  <script>
    const confetti = document.getElementById("confetti");
    const colors = ["#D4AF37", "#10B981", "#F59E0B", "#059669", "#FDE68A"];
    const types = ["✦", "✧", "ribbon", "ribbon"];

    for (let i = 0; i < 40; i++) {
      const el = document.createElement("div");
      const type = types[Math.floor(Math.random() * types.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];

      el.className = "bit";
      if (type === "ribbon") {
        el.classList.add("ribbon");
        el.style.width = `${6 + Math.random() * 6}px`;
        el.style.height = `${12 + Math.random() * 10}px`;
        el.style.background = color;
      } else {
        el.textContent = type;
        el.style.color = color;
        el.style.fontSize = `${10 + Math.random() * 14}px`;
      }

      el.style.left = `${Math.random() * 100}%`;
      el.style.animationDuration = `${5 + Math.random() * 7}s`;
      el.style.animationDelay = `${-Math.random() * 10}s`;
      confetti.appendChild(el);
    }
  </script>
</body>
</html>
