<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Minimalist Anime Webcam Frame</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      width: 640px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      overflow: hidden;
    }

    .cam-container {
      position: relative;
      width: 616px;
      height: 356px;
      border: 2px solid rgba(212, 175, 55, 0.85);
      box-shadow: inset 0 0 0 3px rgba(250, 248, 242, 0.9), 0 8px 24px rgba(10, 35, 25, 0.18);
    }

    /* Sudut aksen Emerald & Gold */
    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 4px solid #10B981;
      z-index: 5;
    }
    .tl { top: -3px; left: -3px; border-right: none; border-bottom: none; }
    .tr { top: -3px; right: -3px; border-left: none; border-bottom: none; border-color: #D4AF37; }
    .bl { bottom: -3px; left: -3px; border-right: none; border-top: none; border-color: #D4AF37; }
    .br { bottom: -3px; right: -3px; border-left: none; border-top: none; }

    /* Badge Kiri Atas */
    .cam-badge {
      position: absolute;
      top: -12px;
      left: 20px;
      background: linear-gradient(135deg, #065F46 0%, #10B981 100%);
      color: #FAF8F2;
      padding: 4px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 100%, 10px 100%);
      border-bottom: 2px solid #D4AF37;
    }

    .rec-dot {
      width: 7px;
      height: 7px;
      background: #FDE68A;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* Label Bawah Kanan */
    .cam-footer {
      position: absolute;
      bottom: -12px;
      right: 20px;
      background: rgba(250, 248, 242, 0.96);
      color: #065F46;
      border: 1.5px solid #D4AF37;
      padding: 3px 14px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    }
  </style>
</head>
<body>
  <div class="cam-container">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="cam-badge">
      <span class="rec-dot"></span>
      <span>LIVE CAM • カメラ</span>
    </div>

    <div class="cam-footer">✦ STREAMER HUD</div>
  </div>
</body>
</html>
