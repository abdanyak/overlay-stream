<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Minimalist Anime Chatbox Frame</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      width: 420px;
      height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      overflow: hidden;
    }

    .chat-box {
      position: relative;
      width: 400px;
      height: 540px;
      background: rgba(250, 248, 242, 0.86);
      border: 1.5px solid rgba(212, 175, 55, 0.75);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(10, 35, 25, 0.14);
    }

    .chat-header {
      height: 46px;
      background: linear-gradient(135deg, #065F46 0%, #10B981 100%);
      border-bottom: 2px solid #D4AF37;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #FAF8F2;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.6px;
    }

    .header-left span.diamond { color: #FDE68A; }

    .header-right {
      font-size: 10px;
      color: #D1FAE5;
      letter-spacing: 1.5px;
    }

    .chat-body {
      flex: 1;
      position: relative;
      /* Garis tipis dekoratif */
      background-image: radial-gradient(rgba(16, 185, 129, 0.12) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .chat-footer {
      height: 26px;
      border-top: 1px solid rgba(212, 175, 55, 0.4);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9px;
      font-weight: 700;
      color: #065F46;
      letter-spacing: 1.2px;
      background: rgba(250, 248, 242, 0.95);
    }

    .dots { display: flex; gap: 4px; }
    .dots span {
      width: 5px;
      height: 5px;
      background: #10B981;
      transform: rotate(45deg);
    }
    .dots span:last-child { background: #D4AF37; }
  </style>
</head>
<body>
  <div class="chat-box">
    <div class="chat-header">
      <div class="header-left"><span class="diamond">✦</span> LIVE CHAT</div>
      <div class="header-right">チャット</div>
    </div>
    <div class="chat-body">
      <!-- Letakkan layer Widget Chat di atas area ini -->
    </div>
    <div class="chat-footer">
      <span>STAY RESPECTFUL • マナーを守ろう</span>
      <div class="dots"><span></span><span></span></div>
    </div>
  </div>
</body>
</html>
