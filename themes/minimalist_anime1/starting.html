<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Minimalist Anime Starting Screen</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      background: radial-gradient(circle at 20% 20%, #FAF8F2 0%, #EEF5F0 55%, #DFECE4 100%);
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Pola grid halus di background */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(16, 185, 129, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Frame luar layar */
    .outer-border {
      position: absolute;
      inset: 36px;
      border: 1.5px solid rgba(212, 175, 55, 0.55);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 820px;
      padding: 64px 72px;
      background: rgba(250, 248, 242, 0.94);
      border: 2px solid #D4AF37;
      border-left: 8px solid #10B981;
      clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 28px, 100% 100%, 28px 100%, 0 calc(100% - 28px));
      box-shadow: 0 20px 50px rgba(6, 95, 70, 0.12);
      text-align: center;
      z-index: 2;
    }

    .jp-sub {
      display: inline-block;
      background: linear-gradient(135deg, #065F46, #10B981);
      color: #FAF8F2;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      padding: 6px 20px;
      margin-bottom: 24px;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    }

    h1 {
      font-size: 54px;
      font-weight: 800;
      color: #1C2B24;
      letter-spacing: 4px;
      margin-bottom: 14px;
    }

    p {
      font-size: 18px;
      color: #4B6358;
      letter-spacing: 1.5px;
      margin-bottom: 40px;
    }

    /* Animasi loading bar minimalis */
    .loader-track {
      width: 100%;
      height: 6px;
      background: rgba(16, 185, 129, 0.15);
      overflow: hidden;
      position: relative;
    }

    .loader-bar {
      position: absolute;
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #065F46, #10B981, #D4AF37);
      animation: slide 2.4s ease-in-out infinite;
    }

    @keyframes slide {
      0% { left: -35%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="outer-border"></div>
  <div class="card">
    <div class="jp-sub">✦ まもなく配信開始 • STANDBY ✦</div>
    <h1>STARTING SOON</h1>
    <p>Siapkan camilan, live stream akan segera dimulai.</p>
    <div class="loader-track">
      <div class="loader-bar"></div>
    </div>
  </div>
</body>
</html>
