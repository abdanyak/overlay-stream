<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Minimalist — Starting Soon (Meriah)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 45%, #FFFDF8 0%, #E6F4EC 55%, #CBE6D7 100%);
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Grid & cahaya latar */
    .bg-grid {
      position: absolute;
      inset: -50px;
      background-image:
        linear-gradient(rgba(16, 185, 129, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.08) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridMove 18s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(48px, 48px); }
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
      animation: floatOrb 8s ease-in-out infinite alternate;
    }
    .orb-1 { width: 420px; height: 420px; background: #A7F3D0; top: -80px; left: -60px; }
    .orb-2 { width: 380px; height: 380px; background: #FDE68A; bottom: -80px; right: -60px; animation-delay: -4s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.12); }
    }

    /* Frame luar */
    .outer-frame {
      position: absolute;
      inset: 28px;
      border: 1.5px solid rgba(212, 175, 55, 0.55);
      pointer-events: none;
      z-index: 2;
    }

    .outer-frame::before, .outer-frame::after {
      content: "✦";
      position: absolute;
      color: #D4AF37;
      font-size: 16px;
      background: #EEF7F2;
      padding: 0 6px;
    }
    .outer-frame::before { top: -11px; left: 24px; }
    .outer-frame::after { bottom: -11px; right: 24px; }

    /* Cincin geometris berputar di belakang kartu */
    .hud-ring {
      position: absolute;
      width: min(82vw, 760px);
      height: min(82vw, 760px);
      pointer-events: none;
      z-index: 1;
      opacity: 0.45;
      animation: spinSlow 36s linear infinite;
    }

    .hud-ring-inner {
      position: absolute;
      width: min(68vw, 620px);
      height: min(68vw, 620px);
      pointer-events: none;
      z-index: 1;
      opacity: 0.35;
      animation: spinReverse 24s linear infinite;
    }

    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes spinReverse { to { transform: rotate(-360deg); } }

    /* Wadah partikel meriah */
    #particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -30px;
      animation: rise linear infinite;
      opacity: 0;
    }

    .particle.diamond {
      transform: rotate(45deg);
    }

    @keyframes rise {
      0% { transform: translateY(0) rotate(0deg) scale(0.7); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(360deg) scale(1.1); opacity: 0; }
    }

    /* Kartu Utama */
    .card {
      position: relative;
      width: min(88vw, 760px);
      padding: clamp(40px, 5.5vw, 66px) clamp(26px, 4vw, 56px);
      background: rgba(250, 248, 242, 0.94);
      backdrop-filter: blur(8px);
      border: 2px solid #D4AF37;
      border-top: 7px solid #10B981;
      clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 28px, 100% 100%, 28px 100%, 0 calc(100% - 28px));
      box-shadow: 0 24px 60px rgba(6, 95, 70, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
      text-align: center;
      z-index: 5;
      overflow: hidden;
    }

    /* Kilau shimmer melintas */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 246, 214, 0.45), transparent);
      animation: sweep 4.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sweep {
      0% { left: -60%; }
      55%, 100% { left: 130%; }
    }

    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #065F46 0%, #10B981 100%);
      color: #FAF8F2;
      font-size: clamp(11px, 1.4vw, 14px);
      font-weight: 700;
      letter-spacing: 2.5px;
      padding: 7px 24px;
      margin-bottom: 24px;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      border-bottom: 2.5px solid #D4AF37;
    }

    .spark { color: #FDE68A; animation: twinkle 1.6s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    h1 {
      font-size: clamp(38px, 6vw, 66px);
      font-weight: 800;
      color: #14241E;
      letter-spacing: 3px;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    h1 span {
      background: linear-gradient(135deg, #065F46 0%, #10B981 55%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(14px, 1.8vw, 19px);
      color: #4B6358;
      font-weight: 600;
      margin-bottom: 36px;
    }

    /* Equalizer & Loading Bar */
    .bottom-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .eq {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 22px;
    }

    .eq span {
      width: 4px;
      background: linear-gradient(to top, #065F46, #10B981, #D4AF37);
      border-radius: 2px;
      animation: bounce 0.9s ease-in-out infinite alternate;
    }
    .eq span:nth-child(1) { height: 10px; animation-delay: 0s; }
    .eq span:nth-child(2) { height: 22px; animation-delay: 0.2s; }
    .eq span:nth-child(3) { height: 14px; animation-delay: 0.4s; }
    .eq span:nth-child(4) { height: 19px; animation-delay: 0.15s; }

    @keyframes bounce {
      0% { transform: scaleY(0.35); }
      100% { transform: scaleY(1); }
    }

    .loader-track {
      flex: 1;
      height: 8px;
      background: rgba(16, 185, 129, 0.16);
      position: relative;
      overflow: hidden;
      border-radius: 99px;
    }

    .loader-bar {
      position: absolute;
      height: 100%;
      width: 36%;
      background: linear-gradient(90deg, #065F46, #10B981, #D4AF37);
      border-radius: 99px;
      animation: slide 2.1s ease-in-out infinite;
    }

    @keyframes slide {
      0% { left: -36%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="outer-frame"></div>

  <!-- Cincin HUD Geometris -->
  <svg class="hud-ring" viewBox="0 0 200 200" fill="none">
    <circle cx="100" cy="100" r="94" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="10 6" />
    <circle cx="100" cy="100" r="82" stroke="#10B981" stroke-width="0.6" stroke-dasharray="4 8" />
    <polygon points="100,8 192,100 100,192 8,100" stroke="#D4AF37" stroke-width="0.5" opacity="0.7" />
  </svg>

  <svg class="hud-ring-inner" viewBox="0 0 200 200" fill="none">
    <circle cx="100" cy="100" r="88" stroke="#065F46" stroke-width="0.7" stroke-dasharray="18 8 4 8" />
  </svg>

  <div id="particles"></div>

  <div class="card">
    <div class="top-pill">
      <span class="spark">✦</span> まもなく配信開始 • GET READY <span class="spark">✦</span>
    </div>

    <h1>STARTING <span>SOON</span></h1>
    <p class="subtitle">Forminge</p>

    <div class="bottom-row">
      <div class="eq"><span></span><span></span><span></span><span></span></div>
      <div class="loader-track"><div class="loader-bar"></div></div>
      <div class="eq"><span></span><span></span><span></span><span></span></div>
    </div>
  </div>

  <script>
    // Generator Partikel Meriah (Kilau & Diamond Emerald/Gold)
    const container = document.getElementById("particles");
    const colors = ["#10B981", "#D4AF37", "#F59E0B", "#059669", "#FDE68A"];
    const shapes = ["✦", "❖", "✧", "diamond"];

    for (let i = 0; i < 34; i++) {
      const el = document.createElement("div");
      const shape = shapes[Math.floor(Math.random() * shapes.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const size = 8 + Math.random() * 14;

      el.className = "particle";
      if (shape === "diamond") {
        el.classList.add("diamond");
        el.style.width = `${size * 0.7}px`;
        el.style.height = `${size * 0.7}px`;
        el.style.background = color;
      } else {
        el.textContent = shape;
        el.style.color = color;
        el.style.fontSize = `${size}px`;
      }

      el.style.left = `${Math.random() * 100}%`;
      el.style.animationDuration = `${6 + Math.random() * 8}s`;
      el.style.animationDelay = `${-Math.random() * 12}s`;
      container.appendChild(el);
    }
  </script>
</body>
</html>
