<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Minimalist Anime TikTok Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      overflow: hidden;
    }

    .toast {
      position: relative;
      width: 430px;
      height: 78px;
      background: rgba(250, 248, 242, 0.96);
      border: 1.5px solid rgba(212, 175, 55, 0.8);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px 0 0;
      box-shadow: 0 8px 20px rgba(10, 35, 25, 0.16);
      animation: slideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes slideIn {
      0% { opacity: 0; transform: translateX(-28px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* Kotak ikon di sisi kiri */
    .icon-box {
      width: 66px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #FAF8F2;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 100%, 0 100%);
      border-left: 4px solid #D4AF37;
      flex-shrink: 0;
    }

    /* Variasi warna tiap event */
    .toast.follow .icon-box {
      background: linear-gradient(135deg, #065F46 0%, #10B981 100%);
    }
    .toast.share .icon-box {
      background: linear-gradient(135deg, #92400E 0%, #D4AF37 100%);
    }
    .toast.like .icon-box {
      background: linear-gradient(135deg, #9F1239 0%, #F43F5E 100%);
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toast.follow .label { color: #065F46; }
    .toast.share .label { color: #B45309; }
    .toast.like .label { color: #BE123C; }

    .user-text {
      font-size: 16px;
      font-weight: 800;
      color: #1C2B24;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-text span {
      font-weight: 600;
      color: #4B6358;
      font-size: 13px;
    }

    /* Dekorasi pojok kanan bawah */
    .accent {
      position: absolute;
      right: 12px;
      bottom: 8px;
      display: flex;
      gap: 4px;
    }
    .accent span {
      width: 4px;
      height: 4px;
      background: #10B981;
      transform: rotate(45deg);
    }
    .accent span:last-child { background: #D4AF37; }
  </style>
</head>
<body>

  <!-- 1. FOLLOW ALERT -->
  <div class="toast follow" data-type="follow">
    <div class="icon-box">✦</div>
    <div class="content">
      <div class="label">NEW FOLLOWER • フォロー</div>
      <div class="user-text">@username <span>baru saja follow!</span></div>
    </div>
    <div class="accent"><span></span><span></span></div>
  </div>

  <!-- 2. SHARE ALERT -->
  <div class="toast share" data-type="share">
    <div class="icon-box">❖</div>
    <div class="content">
      <div class="label">STREAM SHARED • シェア</div>
      <div class="user-text">@username <span>bagikan live ini!</span></div>
    </div>
    <div class="accent"><span></span><span></span></div>
  </div>

  <!-- 3. LIKE / TAP-TAP ALERT -->
  <div class="toast like" data-type="like">
    <div class="icon-box">♥</div>
    <div class="content">
      <div class="label">TAP-TAP LIKE • いいね</div>
      <div class="user-text">@username <span>kirim 100+ tap-tap!</span></div>
    </div>
    <div class="accent"><span></span><span></span></div>
  </div>

  <script>
    // Filter tampilan lewat URL: ?type=follow / ?type=share / ?type=like
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    if (type) {
      document.querySelectorAll('.toast').forEach(el => {
        if (el.dataset.type !== type) el.style.display = 'none';
      });
    }
  </script>
</body>
</html>
